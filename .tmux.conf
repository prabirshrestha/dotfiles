# curl https://gist.githubusercontent.com/prabirshrestha/279d8b179d9353fe8694/raw/.tmux.conf -o ~/.tmux.conf

bind r source-file ~/.tmux.conf \; display "Reloaded!"

## Change the prefix to Ctrl+a
#unbind C-b
#set -g prefix C-a
#bind C-a send-prefix

bind-key -n C-Space send-keys C-Space

# enable pretty colors
set-option -ga terminal-overrides ",xterm-256color:Tc"

# increase scroll-back history
set -g history-limit 5000

# use vim key bindings
setw -g mode-keys vi

# start window index at 1
set -g base-index 1

# start pane index at 1
set -g pane-base-index 1

# change the default delay to make it more responsive
set -sg escape-time 1

# window
bind c new-window -c "#{pane_current_path}"

# Splitting panes
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# pane movements
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# rename the current pane
bind T command-prompt -p "Pane title:" "select-pane -T '%%'"

# pane resizing
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# window movement
bind -r C-h select-window -t:-
bind -r C-l select-window -t:+

# remapping copy paste to vim
# unbind [
bind Escape copy-mode
unbind p
bind p paste-buffer

# Keep mouse selections highlighted in copy mode instead of copying on release.
# Press y or Enter to copy manually without clearing the selection or scrolling
# back to the live output. Press q to leave copy mode.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X stop-selection
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X stop-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-no-clear
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-no-clear

# setw -g monitory-activity on
set -g visual-activity on
# Enable mouse support in ~/.tmux.conf
set -g mouse on

set-option -g renumber-windows on

setw -g aggressive-resize on

# Theme: cmux graphite
# Keep the chrome quiet, then make the active window and pane unmistakably blue.
set -g status-position bottom
set -g status-justify left
set -g status-interval 2
set -g status-style 'bg=#0f1217,fg=#74777c'

# Info on left (I don't have a session display for now)
set -g status-left ''
set -g status-left-length 20

# Inactive windows recede into the cmux background. The active window gets the
# same raised charcoal treatment as a selected cmux tab, with a cool-blue index.
setw -g window-status-separator ''
setw -g window-status-format '#[fg=#74777c,bg=#0f1217] #I:#W#F '
setw -g window-status-current-format '#[fg=#0f1217,bg=#5aa7ff,bold] #I #[fg=#eef1f5,bg=#22262d,bold] #W#F '

# Date and time stay readable without competing with the selected window.
set -g status-right '#[fg=#74777c,bg=#0f1217] %a %b %d #[fg=#aeb4be] %H:%M '
set -g status-right-length 50

# Match cmux's subtle separators and reuse blue only for active UI states.
set -g pane-border-style 'fg=#262b33'
set -g pane-active-border-style 'fg=#5aa7ff'
set -g message-style 'fg=#eef1f5,bg=#22262d'
set -g message-command-style 'fg=#eef1f5,bg=#22262d'
setw -g mode-style 'fg=#0f1217,bg=#5aa7ff,bold'
set -g display-panes-colour '#74777c'
set -g display-panes-active-colour '#5aa7ff'
setw -g clock-mode-colour '#5aa7ff'

# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

set -g default-terminal "screen-256color"
