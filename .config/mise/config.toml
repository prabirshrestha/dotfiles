# Deployed to ~/.config/mise/config.toml for tools available in every directory.
[settings]
idiomatic_version_file_enable_tools = ["node", "rust"]
experimental = true

[tools]
bun = "latest"
"cargo:ferricket" = "latest"
fzf = "latest"
hunk = "latest"
node = "latest"
rust = "latest"
television = { version = "latest", os = ["linux", "macos"] }
# Temporarily disabled: the current npm package is blocked by organizational policy.
# "npm:prettier" = "latest"
uv = "latest"
worktrunk = "latest"
