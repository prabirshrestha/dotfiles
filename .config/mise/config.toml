# Deployed to ~/.config/mise/config.toml for tools available in every directory.
[settings]
idiomatic_version_file_enable_tools = ["node"]
experimental = true

[tools]
7zip = { version = "latest", os = ["windows"] }
bun = "latest"
"cargo:ferricket" = "latest"
fzf = "latest"
gh = "latest"
"github:vercel-labs/agent-browser" = "latest"
"github:vercel-labs/agent-desktop" = "latest"
"github:prabirshrestha/sshdt" = "latest"
"github:chrisant996/clink" = { version = "latest", os = ["windows"], asset_pattern = "clink.*.zip", postinstall = "clink.bat autorun install" }
"github:zenbu-labs/terminal-browser" = { version = "latest", os = ["linux"] }
hunk = "latest"
node = "latest"
ripgrep = { version = "latest", os = ["windows"] }
"npm:@microsoft/workiq" = "latest"
television = { version = "latest", os = ["linux", "macos"] }
# Temporarily disabled: the current npm package is blocked by organizational policy.
# "npm:prettier" = "latest"
uv = "latest"
worktrunk = "latest"
zoxide = { version = "latest", os = ["windows"] }

[tools."github:0xShug0/audio.cpp"]
version = "0.9.3"
os = ["macos"]
asset_pattern = "audio-v*-bin-macos-{{ arch() }}-metal.tar.gz"
# The official archive omits executable permissions on these binaries.
postinstall = 'chmod +x "$MISE_TOOL_INSTALL_PATH/audiocpp_cli" "$MISE_TOOL_INSTALL_PATH/audiocpp_server" "$MISE_TOOL_INSTALL_PATH/audiocpp_gguf"'

# The huacnlee/cargo fork lives in ~/.local/share/cargo-fork/bin. mise rebuilds
# PATH on cd, so let mise keep this folder in front in every shell.
[env]
_.path = ["~/.local/share/cargo-fork/bin"]
# Turn off the daily self-update of the huacnlee/cargo fork.
CARGO_FORK_AUTO_UPDATE = "0"
# Share build output only inside one repo and its worktrees, so crates from
# different rustc versions do not mix.
CARGO_SHARED_DEPS = "0"
