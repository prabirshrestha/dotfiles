min_version = "2026.6.11"

[settings]
experimental = true

[dotfiles]
# Suppress Unix login banners such as "Last login"; ignored on unsupported platforms.
"~/.hushlogin" = { source = ".hushlogin", mode = "symlink" }

[tools]
# Dotter must be available before the global Mise config can be deployed.
"github:SuperCuber/dotter" = "latest"
"npm:calldiff" = "0.5.0"
