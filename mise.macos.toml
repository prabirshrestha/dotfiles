[bootstrap.packages]
"brew:age" = "latest"
"brew:bat" = "latest"
"brew:ca-certificates" = "latest"
"brew:cargo-cache" = "latest"
"brew:cargo-make" = "latest"
"brew:cargo-watch" = "latest"
"brew-cask:copilot-cli" = "latest"
"brew:ddgr" = "latest"
"brew:docker" = "latest"
"brew:docker-compose" = "latest"
"brew:docker-credential-helper" = "latest"
"brew:efm-langserver" = "latest"
"brew:ffmpeg" = "latest"
"brew:fish" = "latest"
"brew:lazydocker" = "latest"
"brew:vim" = "latest"
"brew-cask:radix" = "latest"

# Copilot casks installed by older Mise releases did not own their generated
# completion files. Remove only those generated files so the current cask can
# record and manage them.
[bootstrap.hooks.pre-packages]
run = '''
set -eu

homebrew_prefix="$(brew --prefix)"
for copilot_completion in \
  "$homebrew_prefix/etc/bash_completion.d/copilot" \
  "$homebrew_prefix/share/fish/vendor_completions.d/copilot.fish" \
  "$homebrew_prefix/share/zsh/site-functions/_copilot"
do
  if [ -f "$copilot_completion" ] && \
     [ ! -L "$copilot_completion" ] && \
     grep -Fq '# Generated by `copilot completion' "$copilot_completion"
  then
    rm "$copilot_completion"
  fi
done
'''

[tools."github:Blaizzy/nativ"]
version = "latest"
asset_pattern = "Nativ-*.dmg"

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

[tasks.bootstrap]
description = "Install macOS applications"
run = '''
set -eu

nativ_install="$(mise where github:Blaizzy/nativ)"
nativ_dmg="$(find "$nativ_install" -maxdepth 1 -type f -name 'Nativ-*.dmg' -print -quit)"
if [ -z "$nativ_dmg" ]; then
  echo "Nativ DMG not found in $nativ_install" >&2
  exit 1
fi

nativ_mount="$(mktemp -d "${TMPDIR:-/tmp}/nativ.XXXXXX")"
nativ_stage="$(mktemp -d "/Applications/.nativ-install.XXXXXX")"
nativ_target="/Applications/Nativ.app"
nativ_previous="$nativ_stage/Nativ.previous.app"
cleanup_nativ() {
  hdiutil detach "$nativ_mount" -quiet >/dev/null 2>&1 || true
  rmdir "$nativ_mount" >/dev/null 2>&1 || true
  if [ ! -d "$nativ_target" ] && [ -d "$nativ_previous" ]; then
    mv "$nativ_previous" "$nativ_target" >/dev/null 2>&1 || true
  fi
  rm -rf "$nativ_stage" >/dev/null 2>&1 || true
}
trap cleanup_nativ EXIT HUP INT TERM

# A killed bootstrap can leave this disk image attached at an old temporary
# mount. Eject only devices backed by the same image before attaching it again.
hdiutil info | awk -v image="$nativ_dmg" '
  /^image-path[[:space:]]*:/ { current = substr($0, index($0, ":") + 2) }
  /^\/dev\/disk[0-9]+[[:space:]]/ && current == image { print $1 }
' | while IFS= read -r nativ_device; do
  hdiutil detach "$nativ_device"
done
hdiutil attach -nobrowse -readonly -mountpoint "$nativ_mount" "$nativ_dmg"
nativ_source="$nativ_mount/Nativ.app"

if [ ! -d "$nativ_source" ]; then
  echo "Nativ.app not found in $nativ_dmg" >&2
  exit 1
fi

nativ_source_version="$(defaults read "$nativ_source/Contents/Info" CFBundleShortVersionString)"
nativ_target_version=""
if [ -d "$nativ_target" ]; then
  nativ_target_version="$(defaults read "$nativ_target/Contents/Info" CFBundleShortVersionString 2>/dev/null || true)"
fi

if [ "$nativ_target_version" = "$nativ_source_version" ]; then
  echo "Nativ $nativ_source_version is already installed"
  exit 0
fi

codesign --verify --deep --strict "$nativ_source"
spctl --assess --type execute --verbose "$nativ_source"
ditto "$nativ_source" "$nativ_stage/Nativ.app"
if [ -d "$nativ_target" ]; then
  mv "$nativ_target" "$nativ_previous"
fi
if ! mv "$nativ_stage/Nativ.app" "$nativ_target"; then
  if [ -d "$nativ_previous" ]; then
    mv "$nativ_previous" "$nativ_target"
  fi
  exit 1
fi
echo "Installed Nativ $nativ_source_version in /Applications"
'''
