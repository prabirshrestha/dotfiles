[dotfiles]
# GhosttyWin32 reads this exact LocalAppData path. mise falls back to copying
# file symlinks on Windows, while preserving the declarative symlink intent.
"~/AppData/Local/ghostty/config" = { source = ".config/ghostty/config.windows", mode = "symlink" }

# psmux checks this path before falling back to ~/.tmux.conf.
"~/.psmux.conf" = { source = ".config/psmux/psmux.conf", mode = "symlink" }

# Clink loads settings and Lua scripts from its LocalAppData state directory.
"~/AppData/Local/clink/clink_settings" = { source = "clink/clink_settings", mode = "symlink" }
"~/AppData/Local/clink/home.lua" = { source = "clink/home.lua", mode = "symlink" }
"~/AppData/Local/clink/zoxide.lua" = { source = "clink/zoxide.lua", mode = "symlink" }

[tools]
# Needed by bootstrap before Dotter deploys the global Mise config.
"github:chrisant996/clink" = { version = "latest", asset_pattern = "clink.*.zip", postinstall = "clink.bat autorun install" }

[tasks.bootstrap]
description = "Enable portable Clink in Command Prompt"
shell = "powershell.exe -NoProfile -Command"
run = '''
$ErrorActionPreference = 'Stop'
$clinkDir = mise where github:chrisant996/clink
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
& (Join-Path $clinkDir 'clink.bat') autorun install
exit $LASTEXITCODE
'''
